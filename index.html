 {id:'aufbau',t:'Aufbau der Bundeswehr',d:'Streitkräfte, Teilstreitkräfte und die zivile Verwaltung',deck:'beh',b:()=>`
  <p>Kern der Bundeswehr sind die Streitkräfte mit vier Teilstreitkräften:</p>
  <ol class="ladder">
   <li><strong>${tskSym('heer')}Heer</strong><span>Kampf an Land</span></li>
   <li><strong>${tskSym('lw')}Luftwaffe</strong><span>Luftraum und Luftverteidigung</span></li>
   <li><strong>${tskSym('mar')}Marine</strong><span>Einsatz auf und unter See</span></li>
   <li><strong>${tskSym()}Cyber- und Informationsraum (CIR)</strong><span>Die jüngste: IT, Cyberabwehr und elektronischer Kampf</span></li>
  </ol>
  <p>Heer, Luftwaffe und Marine erkennt man an ihren Symbolen, etwa an der Schirmmütze: gekreuzte Schwerter, Schwinge und Anker. Der CIR hat kein eigenes Symbol, weil er keine eigene Uniform hat. Seine Angehörigen tragen die von Heer, Luftwaffe oder Marine, dazu das marineblaue Barett mit dem Abzeichen CIR.</p>
  <p>Jede Teilstreitkraft hat eigene Bezeichnungen für ihre Ebenen. Dazu kommen der Unterstützungsbereich unter dem Unterstützungskommando und das Operative Führungskommando, das seit Oktober 2024 alle Einsätze im In- und Ausland plant und führt.</p>
  <p>Neben den Streitkräften steht die zivile Bundeswehrverwaltung. Dazu gehören die großen Bundesämter, etwa für Ausrüstung (BAAINBw), Personal (BAPersBw) oder Infrastruktur (BAIUDBw). Das BAAINBw ist eine zivile Bundesoberbehörde mit rund 10.000 zivilen und 1.800 militärischen Beschäftigten.</p>
  <div class="callout">In der zivilen Bundeswehrverwaltung arbeiten überwiegend Beamtinnen, Beamte und Tarifbeschäftigte. Für sie gelten Amtsbezeichnungen statt Dienstgrade.</div>
  <p>Im Inland arbeitet die Bundeswehr in der Amts- und Katastrophenhilfe mit den Behörden und Organisationen mit Sicherheitsaufgaben (BOS) zusammen, etwa Polizei, Feuerwehr und THW.</p>`},
 {id:'staat',t:'Bundeswehr im Staat',d:'Parlamentsarmee, Befehlsgewalt, Innere Führung, Soldatenpflichten, Führen mit Auftrag und wer dient',deck:'staat',b:()=>`
  <p>Die Bundeswehr ist eine Parlamentsarmee. Ihr Auftrag steht im Grundgesetz: Der Bund stellt Streitkräfte zur Verteidigung auf (Art. 87a GG). Für andere Zwecke darf er sie nur einsetzen, soweit das Grundgesetz es ausdrücklich erlaubt, etwa in der Amts- und Katastrophenhilfe oder in einem System kollektiver Sicherheit wie NATO und Vereinten Nationen.</p>
  <h3>Wer befiehlt</h3>
  <p>Im Frieden hat die Bundesministerin oder der Bundesminister der Verteidigung die Befehls- und Kommandogewalt (Art. 65a GG), kurz IBuK. Im Verteidigungsfall geht sie auf die Bundeskanzlerin oder den Bundeskanzler über (Art. 115b GG). Der Generalinspekteur ist der ranghöchste Soldat und militärischer Berater der Bundesregierung, aber kein Oberbefehlshaber.</p>
  <h3>Was der Bundestag entscheidet</h3>
  <ol class="ladder">
   <li><strong>Einsätze</strong><span>Bewaffnete Einsätze im Ausland brauchen vorher die Zustimmung des Bundestages, das Mandat. Es ist befristet und legt Auftrag, Einsatzgebiet und Personalobergrenze fest. Bei Gefahr im Verzug wird die Zustimmung nachgeholt (Parlamentsbeteiligungsgesetz).</span></li>
   <li><strong>Geld</strong><span>Der Bundestag beschließt den Verteidigungshaushalt, den Einzelplan 14. Beschaffungen ab 25 Millionen Euro gehen vorher in den Haushaltsausschuss.</span></li>
   <li><strong>Krisenfälle</strong><span>Spannungs- und Verteidigungsfall stellt der Bundestag mit Zweidrittelmehrheit fest, den Verteidigungsfall auf Antrag der Bundesregierung und mit Zustimmung des Bundesrates (Art. 80a, 115a GG).</span></li>
   <li><strong>Kontrolle</strong><span>Der Verteidigungsausschuss kann sich selbst als Untersuchungsausschuss einsetzen (Art. 45a GG). Dazu kommt die oder der Wehrbeauftragte (Art. 45b GG).</span></li>
  </ol>
  <div class="callout">Die oder der Wehrbeauftragte wird vom Bundestag für fünf Jahre gewählt und berichtet jährlich über den Zustand der Truppe. Jede Soldatin und jeder Soldat kann sich direkt dorthin wenden, ohne Dienstweg und ohne Nachteile.</div>
  <h3>Innere Führung</h3>
  <p>Die Führungskultur der Bundeswehr heißt Innere Führung, ihr Leitbild ist der „Staatsbürger in Uniform“. Soldatinnen und Soldaten behalten ihre Grundrechte, soweit das Soldatengesetz sie nicht ausdrücklich einschränkt. Gehorsam hat Grenzen: Ein Befehl, der die Menschenwürde verletzt oder keinem dienstlichen Zweck dient, ist unverbindlich. Würde durch das Befolgen eine Straftat begangen, darf er nicht befolgt werden (§ 11 Soldatengesetz).</p>
  <h3>Soldatenpflichten</h3>
  <p>Das Soldatengesetz legt fest, was von Soldatinnen und Soldaten erwartet wird. Diese Pflichten prägen auch den Umgang miteinander:</p>
  <ol class="ladder">
   <li><strong>§ 7 Grundpflicht</strong><span>Der Bundesrepublik Deutschland treu dienen und das Recht und die Freiheit des deutschen Volkes tapfer verteidigen.</span></li>
   <li><strong>§ 10 Vorgesetzte</strong><span>In Haltung und Pflichterfüllung ein Beispiel geben, Dienstaufsicht führen und für die Untergebenen sorgen.</span></li>
   <li><strong>§ 11 Gehorsam</strong><span>Befehle vollständig, gewissenhaft und unverzüglich ausführen, mit den oben genannten Grenzen.</span></li>
   <li><strong>§ 12 Kameradschaft</strong><span>Würde, Ehre und Rechte der Kameraden achten und ihnen in Not und Gefahr beistehen.</span></li>
   <li><strong>§ 13 Wahrheit</strong><span>In dienstlichen Angelegenheiten die Wahrheit sagen, gerade in Meldungen.</span></li>
  </ol>
  <div class="callout">Kameradschaft ist eine Dienstpflicht, keine Frage der Sympathie. Sie schließt gegenseitige Anerkennung, Rücksicht und die Achtung anderer Anschauungen ein. Wer Kameraden schikaniert oder bloßstellt, verletzt seine Pflichten und muss mit Disziplinarmaßnahmen rechnen.</div>
  <h3>Führen mit Auftrag</h3>
  <p>Zur Inneren Führung gehört das Prinzip „Führen mit Auftrag“, auch Auftragstaktik: Vorgesetzte geben ihre Absicht vor, also was erreicht werden soll und warum, dazu Ziel, Mittel und Zeit. Den Weg wählen die Geführten selbst. Ändert sich die Lage, handeln sie im Sinne dieser Absicht, statt auf einen neuen Befehl zu warten. Das Prinzip stammt aus dem preußischen Heer des 19. Jahrhunderts und ist mit Generalfeldmarschall Helmuth von Moltke verbunden. Das Gegenstück heißt Befehlstaktik: Der Befehl schreibt auch den Weg im Detail vor.</p>
  <blockquote class="callout">„Kein Operationsplan reicht mit einiger Sicherheit über das erste Zusammentreffen mit der feindlichen Hauptmacht hinaus.“ Helmuth von Moltke, 1871. Heute meist verkürzt zu „Kein Plan überlebt die erste Feindberührung“. Genau deshalb zählt die Absicht mehr als der Plan.</blockquote>
  <p>Wie ein Befehl entsteht, beschreibt der Führungsvorgang. Er ist ein Kreislauf aus drei Schritten:</p>
  <ol class="ladder">
   <li><strong>Lage&shy;feststellung</strong><span>Was hat sich geändert? Dazu gehören Aufklärung und die Kontrolle, ob frühere Befehle umgesetzt werden.</span></li>
   <li><strong>Planung</strong><span>Die Lage beurteilen, Möglichkeiten abwägen und einen Entschluss fassen.</span></li>
   <li><strong>Befehls&shy;gebung</strong><span>Aus dem Entschluss wird ein Befehl. Danach beginnt der Kreis mit der Lagefeststellung von vorn.</span></li>
  </ol>
  <p>Der Befehl selbst folgt einem festen Schema, Merkwort LADEF:</p>
  <ol class="ladder">
   <li><strong>1. Lage</strong><span>Was ist los? Feind, eigene Kräfte, Gelände, Absicht der übergeordneten Führung.</span></li>
   <li><strong>2. Auftrag</strong><span>Was ist zu tun und wozu? Der Kern des Befehls, kurz und eindeutig.</span></li>
   <li><strong>3. Durch&shy;führung</strong><span>Wie wird es gemacht? Die Absicht der eigenen Führung und die Aufträge an die unterstellten Teile.</span></li>
   <li><strong>4. Einsatz&shy;unterstützung</strong><span>Versorgung, Sanität, Transport. Früher „Versorgung“.</span></li>
   <li><strong>5. Führungs&shy;unterstützung</strong><span>Funk, Meldewege, Gefechtsstand. Früher „Führung und Fernmeldewesen“.</span></li>
  </ol>
  <p>Lage, Auftrag und Durchführung sind immer dabei, die Punkte 4 und 5 je nach Umfang. Die Gliederung ist in der NATO gleich. Die US-Streitkräfte nennen sie <em>Situation, Mission, Execution, Sustainment, Command and Signal</em>. Auch die Auftragstaktik haben sie übernommen: Seit 2012 steht sie als <em>Mission Command</em> in der Doktrin der US Army.</p>
  <div class="callout">Das Schema prägt auch Besprechungen. Ein Lagevortrag beginnt mit der Lage, und auf die Frage „Was ist die Absicht?“ wird die Antwort auf das Warum erwartet, nicht nur das Was.</div>
  <h3>Wer dient</h3>
  <ol class="ladder">
   <li><strong>Berufssoldaten (BS)</strong><span>Dienen bis zur gesetzlichen Altersgrenze und schwören den Diensteid.</span></li>
   <li><strong>Soldaten auf Zeit (SaZ)</strong><span>Verpflichten sich für eine feste Zeit, höchstens 25 Jahre. Auch sie schwören den Diensteid.</span></li>
   <li><strong>Wehrdienstleistende</strong><span>Leisten freiwilligen Wehrdienst (FWDL) und legen das feierliche Gelöbnis ab.</span></li>
   <li><strong>Reservisten</strong><span>Ehemalige Soldatinnen und Soldaten. Bei einer Übung heißen sie Reservistendienstleistende (RDL).</span></li>
   <li><strong>Zivilbeschäftigte</strong><span>Beamtinnen, Beamte und Tarifbeschäftigte, vor allem in der Bundeswehrverwaltung.</span></li>
  </ol>
  <p>Die Wehrpflicht ist seit dem 1. Juli 2011 ausgesetzt, aber nicht abgeschafft. Im Spannungs- und Verteidigungsfall gilt sie wieder. Seit 2026 gilt der neue Wehrdienst: Alle 18-Jährigen erhalten einen Fragebogen zu Eignung und Bereitschaft, für Männer ist er verpflichtend, für Frauen freiwillig. Ab Juli 2027 werden junge Männer wieder gemustert. Der Dienst selbst bleibt freiwillig, reichen die Freiwilligen nicht, kann der Bundestag per Gesetz eine Bedarfswehrpflicht beschließen.</p>
  <p>Wer zur Bundeswehr will, wendet sich an ein Karrierecenter der Bundeswehr. Die Karrierecenter gehören zum BAPersBw, beraten über Karriereberatungsbüros in der Fläche, prüfen die Eignung und übernehmen auch die Musterung. Die früheren Kreiswehrersatzämter gibt es seit 2012 nicht mehr.</p>`},
 {id:'dienstgrade',t:'Dienstgrade verstehen',d:'Laufbahnen, Dienstgradgruppen und NATO-Rangcodes',deck:'dg',b:()=>`
  <p>Es gibt drei Laufbahngruppen: Mannschaften, Unteroffiziere und Offiziere. Sie gliedern sich in sieben Dienstgradgruppen mit zusammen 26 Dienstgraden:</p>
  <ol class="ladder">${Object.values(G).map(g=>`<li><strong>${esc(g)}</strong><span>${RANKS.filter(r=>r.g===g).map(r=>esc(r.k||r.h)).join(', ')}</span></li>`).join('')}</ol>
  <p>Sanitätsoffiziere, also Ärztinnen und Ärzte, haben eigene Dienstgrade. Sie stehen jeweils auf der Ebene eines Offiziers: Stabsarzt (Hauptmann), Oberstabsarzt (Major), Oberfeldarzt (Oberstleutnant), Oberstarzt (Oberst), Generalarzt (Brigadegeneral), Generalstabsarzt (Generalmajor) und Generaloberstabsarzt (Generalleutnant). Einen Sanitätsdienstgrad mit vier Sternen gibt es nicht. In der Marine heißen die Dienstgrade ab Oberfeldarzt anders, etwa Flottillenarzt oder Admiralarzt. Apotheker und Tierärzte haben eigene Namen, etwa Stabsapotheker oder Stabsveterinär.</p>
  <p>„Portepee“ trennt einfache Unteroffiziere von den Feldwebeldienstgraden. Feldwebel sind meist Spezialisten oder erfahrene Führer und tragen viel Verantwortung im Alltag einer Einheit.</p>
  <p>Das Wort kommt aus dem Französischen: <em>porte-épée</em> heißt wörtlich „Degenträger“. Gemeint ist die Quaste am Griff von Degen oder Säbel. Sie war ursprünglich eine Schlaufe, damit die Waffe im Gefecht nicht verloren ging. In Preußen wurde daraus ein Rangzeichen: Offiziere und Feldwebel trugen ein Portepee in Silber oder Gold, einfache Unteroffiziere nicht. Daher kommen die Bezeichnungen „mit“ und „ohne Portepee“.</p>
  <p>Für internationale Zusammenarbeit gibt es die NATO-Rangcodes: OR-1 bis OR-9 für Mannschaften und Unteroffiziere, OF-1 bis OF-9 für Offiziere. Ein OF-4 ist in jeder NATO-Armee vergleichbar, in der Bundeswehr entspricht ihm der Oberstleutnant, in der Marine der Fregattenkapitän.</p>
  <div class="callout">Die Marine hat für fast alle Dienstgrade ab Unteroffizier eigene Namen: aus dem Feldwebel wird der Bootsmann, aus dem Major der Korvettenkapitän. Die Rangfolge ist identisch.</div>`},
 {id:'abzeichen',t:'Abzeichen lesen',d:'Das System hinter Streifen, Bögen, Rauten und Eichenlaub',deck:'abz',b:()=>`
  <p>Man muss nicht 26 Bilder auswendig lernen. Die Abzeichen folgen einer Logik, in Heer und Luftwaffe gleich, die Luftwaffe trägt zusätzlich die Schwinge.</p>
  <h3>Mannschaften: Schrägstreifen</h3>
  <p>Je mehr Streifen, desto höher. Korporal und Stabskorporal tragen einen breiten Balken.</p>
  ${figs([['heer:Gefreiter','Gefreiter'],['heer:Obergefreiter','Ober­gefreiter'],['heer:Hauptgefreiter','Haupt­gefreiter'],['heer:Stabsgefreiter','Stabs­gefreiter'],['heer:Oberstabsgefreiter','Ober­stabs­gefreiter'],['heer:Korporal','Korporal'],['heer:Stabskorporal','Stabs­korporal']])}
  <h3>Unteroffiziere: der Bogen (Tresse)</h3>
  <p>Offener Bogen: Unteroffizier. Geschlossener Bogen: ab Stabsunteroffizier. Winkel im Bogen: Feldwebeldienstgrade. Eine kleine Raute über dem Winkel kommt ab Hauptfeldwebel dazu.</p>
  ${figs([['heer:Unteroffizier','Unter­offizier'],['heer:Stabsunteroffizier','Stabs­unter­offizier'],['heer:Feldwebel','Feldwebel'],['heer:Oberfeldwebel','Ober­feld­webel'],['heer:Hauptfeldwebel','Haupt­feld­webel'],['heer:Stabsfeldwebel','Stabs­feld­webel'],['heer:Oberstabsfeldwebel','Ober­stabs­feld­webel']])}
  <h3>Offiziere: Sterne, dann Eichenlaub, dann Gold</h3>
  <p>Leutnante und Hauptleute zählen Sterne (eins bis drei, Stabshauptmann vier). Stabsoffiziere tragen zusätzlich Eichenlaub und zählen wieder von eins. Generale tragen goldenes Eichenlaub mit ein bis vier goldenen Sternen. Am Kampfanzug werden silberne Abzeichen schwarz oder weiß getragen, goldene bleiben golden.</p>
  ${figs([['heer:Leutnant','Leutnant'],['heer:Oberleutnant','Ober­leutnant'],['heer:Hauptmann','Haupt­mann'],['heer:Stabshauptmann','Stabs­haupt­mann'],['heer:Major','Major'],['heer:Oberstleutnant','Oberst­leutnant'],['heer:Oberst','Oberst'],['heer:Brigadegeneral','Brigade­general'],['heer:Generalmajor','General­major'],['heer:Generalleutnant','General­leutnant'],['heer:General','General']])}
  <h3>Sanitätsoffiziere: der Äskulapstab</h3>
  <p>Sanitätsoffiziere tragen das Abzeichen der Offiziere auf derselben Ebene, dazu den Äskulapstab.</p>
  ${figs([['san:Stabsarzt','Stabs­arzt'],['san:Oberstabsarzt','Ober­stabs­arzt'],['san:Oberfeldarzt','Ober­feld­arzt'],['san:Oberstarzt','Oberst­arzt'],['san:Generalarzt','General­arzt'],['san:Generalstabsarzt','General­stabs­arzt'],['san:Generaloberstabsarzt','General­ober­stabs­arzt']])}
  <h3>Luftwaffe: die Schwinge</h3>
  <p>Am Feldanzug trägt die Luftwaffe dieselben Abzeichen wie das Heer, unten auf der Schulterklappe kommt die Schwinge dazu. Streifen, Bogen, Sterne und Eichenlaub rücken ein Stück nach oben. Auch die Namen sind gleich, nur der niedrigste Dienstgrad heißt in der Luftwaffe Flieger.</p>
  ${figs([['lw:Flieger','Flieger'],['lw:Major','Major']])}
  <h3>Marine-Offiziere: Ärmelstreifen</h3>
  <p>Gezählt werden die mittelbreiten Streifen: einer beim Leutnant zur See, vier beim Kapitän zur See. Ein dünner Zusatzstreifen markiert die Zwischenstufe. Admirale erkennt man am breiten Streifen unten.</p>
  ${figs([['mar:Leutnant zur See','Leutnant zur See'],['mar:Oberleutnant zur See','Ober­leutnant zur See'],['mar:Kapitänleutnant','Kapitän­leutnant'],['mar:Stabskapitänleutnant','Stabs­kapitän­leutnant'],['mar:Korvettenkapitän','Korvetten­kapitän'],['mar:Fregattenkapitän','Fregatten­kapitän'],['mar:Kapitän zur See','Kapitän zur See'],['mar:Flottillenadmiral','Flottillen­admiral'],['mar:Konteradmiral','Konter­admiral'],['mar:Vizeadmiral','Vize­admiral'],['mar:Admiral','Admiral']])}
  <h3>Offizieranwärter: Kordel und Stern</h3>
  <p>Offizieranwärter (OA) sind auf dem Weg zum Offizier, stehen aber noch auf der Ebene von Mannschaften oder Unteroffizieren. In Heer und Luftwaffe tragen sie eine silberfarbene Kordel, die über die Schulterklappe gezogen wird. In der Marine tragen sie stattdessen einen goldfarbenen fünfzackigen Stern auf Schulterklappe und Ärmel, das Laufbahnabzeichen der Offiziere, oft Seestern genannt.</p>
  ${figs([['heer:Fahnenjunker','Fahnen­junker'],['heer:Fähnrich','Fähnrich'],['heer:Oberfähnrich','Ober­fähnrich'],['mar:Seekadett','See­kadett'],['mar:Fähnrich zur See','Fähnrich zur See'],['mar:Oberfähnrich zur See','Ober­fähnrich zur See']])}
  <p>Auf der Ebene der Unteroffiziere haben Offizieranwärter eigene Dienstgrade: Fahnenjunker, Fähnrich und Oberfähnrich, in der Marine Seekadett, Fähnrich zur See und Oberfähnrich zur See. Davor führen sie ihren Mannschaftsdienstgrad mit dem Zusatz OA, etwa Gefreiter OA. Bei Fahnenjunker, Fähnrich und Co. entfällt der Zusatz, weil der Dienstgrad die Laufbahn schon verrät.</p>
  <h3>Unteroffizier- und Feldwebelanwärter: Balken und Kordel</h3>
  <p>Auch wer Unteroffizier oder Feldwebel werden will, ist gekennzeichnet. Unteroffizieranwärter (UA) tragen einen Querbalken über den Dienstgradabzeichen. Nach bestandenem Lehrgang (UA mbL) kommt unten eine altgoldfarbene Tresse dazu.</p>
  ${figs([['heer:Schütze+ua','Schütze UA'],['heer:Hauptgefreiter+ua','Haupt­gefreiter UA'],['heer:Stabsgefreiter+ua+mbl','Stabs­gefreiter UA mbL']])}
  <p>Feldwebelanwärter (FA) tragen in Heer und Luftwaffe wie die Offizieranwärter eine Kordel, aber altgoldfarben statt silberfarben.</p>
  ${figs([['heer:Gefreiter+fa','Gefreiter FA'],['heer:Unteroffizier+fa','Unter­offizier FA'],['heer:Fahnenjunker','Fahnen­junker (OA) zum Vergleich']])}
  <p>In der Marine heißen sie Maatanwärter (MA) und Bootsmannanwärter (BA). Sie tragen einen beziehungsweise zwei Querbalken.</p>
  ${figs([['mar:Gefreiter+ua','Gefreiter MA'],['mar:Gefreiter+ba','Gefreiter BA'],['mar:Obermaat+ba','Obermaat BA']])}
  <p>Alle Abzeichen der Luftwaffe und die der Marine-Unteroffiziere stehen unter <a href="#/nachschlagen/abzeichen">Nachschlagen → Abzeichen</a>.</p>`},
 {id:'anzuege',t:'Feldanzug und Dienstanzug',d:'Welcher Anzug wann getragen wird und woran man die Teilstreitkraft erkennt',deck:'abz',b:()=>`
  <p>Im Alltag begegnen einem vor allem zwei Anzüge. Im Feldanzug sehen alle fast gleich aus. Am Dienstanzug erkennt man Heer, Luftwaffe und Marine schon von Weitem.</p>
  <h3>Feldanzug: für alle gleich</h3>
  <p>Der Feldanzug ist in der Regel der Tagesdienstanzug: Feldmütze, Feldbluse und Feldhose im fünffarbigen Flecktarn, dazu Kampfstiefel.</p>
  ${suits([['feld','Feldanzug']])}
  <p>Alle Teilstreitkräfte tragen denselben Feldanzug. Unterschiede gibt es nur an der Schulterklappe: Im Heer sitzt dort die Litze in Waffenfarbe, in der Luftwaffe die Schwinge unter dem Dienstgradabzeichen. Für Ausbildung, Übung und Einsatz gibt es zusätzlich einen eigenen Kampfanzug mit Kälte- und Nässeschutz.</p>
  <p>Fliegendes und technisches Personal der Luftwaffe trägt außerdem einen Flugdienstanzug. Auf Schiffen und Booten ist der blaue Bord- und Gefechtsanzug der Tagesdienstanzug der Marine.</p>
  <h3>Dienstanzug: drei Farben</h3>
  <p>Der Dienstanzug ist die Ausgehuniform außerhalb militärischer Anlagen und wird zu offiziellen Anlässen wie Appellen, Gelöbnissen und Trauerfeiern getragen. In manchen Dienststellen, etwa im Verteidigungsministerium, ist er auch Tagesdienstanzug.</p>
  ${suits([['heer','Heer'],['lw','Luftwaffe'],['mar','Marine']])}
  <ol class="ladder">
   <li><strong>Heer: grau</strong><span>Graue Jacke, anthrazitfarbene Hose. Kragenspiegel und Schulterklappen in Waffenfarbe, dazu das Barett in der Farbe der Truppengattung</span></li>
   <li><strong>Luftwaffe: blau</strong><span>Blaue Jacke, hellblaues Hemd, dunkelblaue Krawatte. Kopfbedeckung ist das blaue Schiffchen</span></li>
   <li><strong>Marine: dunkelblau</strong><span>Zweireihige Jacke mit weißem Hemd und weißer Mütze, keine Kragenspiegel. Den Dienstgrad zeigen die Ärmel. Junge Mannschaften tragen den klassischen Matrosenanzug</span></li>
  </ol>
  <p>Der Cyber- und Informationsraum hat keine eigene Uniform. Seine Angehörigen tragen je nach Dienstposten die Uniform von Heer, Luftwaffe oder Marine, ihren sogenannten Uniformträgerbereich. Gemeinsames Erkennungszeichen ist das marineblaue Barett mit dem Abzeichen CIR. Dasselbe Prinzip gilt im Unterstützungsbereich, etwa im Sanitätsdienst.</p>
  <div class="callout">Weiß trägt nur die Marine: Den Sommeranzug gibt es im Allgemeinen erst südlich des 40. Breitengrads, im Inland ist er nicht erlaubt.</div>`},
 {id:'farben',t:'Waffenfarbe und Barett',d:'Litze, Kragenspiegel und Barett verraten die Truppengattung',deck:'abz',b:()=>`
  <p>Das Dienstgradabzeichen sagt, welchen Rang jemand hat. Wozu jemand gehört, zeigt im Heer die Farbe. Jede Truppengattung hat ihre eigene Waffenfarbe, die Tradition reicht bis 1915 zurück.</p>
  <h3>Am Feldanzug: die Litze</h3>
  <p>An den Schulterklappen des Feldanzugs sitzt eine etwa 4 mm schmale Schlaufe in Waffenfarbe, die Litze. Grün heißt Infanterie, Rosa Panzertruppe, Schwarz Pioniere. Die Dienstgradabzeichen selbst sind bei allen gleich.</p>
  <h3>Am Dienstanzug: der Kragenspiegel</h3>
  <p>Am grauen Dienstanzug erscheint dieselbe Farbe als Kragenspiegel mit silberner Doppellitze und als Umrandung der Schulterklappen. Zwei Ausnahmen fallen sofort auf: Generale tragen goldene Stickerei auf Hochrot, Offiziere im Generalstabsdienst einen karmesinroten Kragenspiegel.</p>
  <div class="figs">${[...['Infanterie','Panzer','Aufklärer','Artillerie','Pioniere','Heeres­flieger','Fernmelder','Logistik','Sanität'].map((t,i)=>[WAFF[i][1],t]),['gen','Generale']].map(([c,t])=>`<figure>${collar(c,30)}<figcaption>${esc(t)}</figcaption></figure>`).join('')}</div>
  <h3>Das Barett</h3>
  <p>Die Barettfarbe fasst mehrere Truppengattungen zu Gruppen zusammen. Grün tragen Jäger und Panzergrenadiere, Schwarz Panzer und Aufklärer, Bordeauxrot Fallschirmjäger, KSK und Heeresflieger. Korallenrot steht für die meisten unterstützenden Truppen wie Artillerie, Pioniere und Fernmelder. Die genaue Truppengattung zeigt das Metallabzeichen am Barett.</p>
  <p>Die Gebirgsjäger tragen statt des Baretts die Bergmütze. Wer zum Cyber- und Informationsraum gehört, trägt unabhängig von der Truppengattung ein marineblaues Barett.</p>
  <div class="callout">Luftwaffe und Marine haben keine Truppengattungen und deshalb auch keine bunten Litzen. Die Luftwaffe trägt meist das blaue Schiffchen, die Marine hat am Dienstanzug keine Kragenspiegel. Alle Farben stehen unter Nachschlagen bei den Abzeichen.</div>`},
 {id:'anrede',t:'Anrede und Umgang',d:'Anrede nach Dienstgrad, Generale, Sanitätsdienst und ungeschriebene Regeln',deck:'eti',b:()=>`
  <p>Angesprochen wird mit Herr oder Frau und dem Dienstgrad, gegebenenfalls mit Nachnamen: „Herr Oberstleutnant“, „Frau Hauptmann Müller“. Dienstgrade bleiben grammatisch männlich, eine „Hauptfrau“ gibt es nicht.</p>
  <p>Alle Generale werden mit „Herr General“ bzw. „Frau General“ angesprochen, auch Brigadegeneral, Generalmajor und Generalleutnant. Der Plural lautet in der Bundeswehr Generale. Ranghöchster Soldat ist der Generalinspekteur der Bundeswehr.</p>
  <p>Sanitätsoffiziere werden mit ihrem eigenen Dienstgrad angesprochen, etwa „Herr Oberstabsarzt“ oder „Frau Generalarzt“.</p>
  <h3>Ungeschriebene Regeln</h3>
  <ol class="ladder">
   <li><strong>Melden macht frei</strong><span>Wer etwas meldet, gibt Verantwortung und Entscheidung an die Vorgesetzten weiter. Deshalb wird auch Kleines gemeldet, lieber einmal zu oft als zu selten.</span></li>
   <li><strong>Fünf Minuten vor der Zeit</strong><span>Das ist die Soldatenpünktlichkeit. Wer auf die Minute genau kommt, gilt schon als knapp.</span></li>
   <li><strong>Dienstweg</strong><span>Anliegen gehen über die direkten Vorgesetzten. Auch als Zivilist kommt es gut an, zuerst die zuständige Stelle anzusprechen und nicht gleich ganz oben.</span></li>
  </ol>
  <h3>Gelöbnis, Eid und Zeremonien</h3>
  <p>Wehrdienstleistende legen ein feierliches Gelöbnis ab, Soldaten auf Zeit und Berufssoldaten schwören den Diensteid (§ 9 Soldatengesetz). Die höchste militärische Zeremonie ist der Große Zapfenstreich, etwa zur Verabschiedung von Bundespräsidenten, Bundeskanzlern oder Verteidigungsministern.</p>
  <p>An der Uniform zeigen Tätigkeitsabzeichen eine Qualifikation oder Verwendung, etwa als Fallschirmspringer. Die Einsatzmedaille erhält, wer an einem Auslandseinsatz teilgenommen hat. Das Ehrenzeichen der Bundeswehr gibt es als Ehrenmedaille und als Ehrenkreuz in Bronze, Silber und Gold. Die höchste Stufe ist seit 2008 das Ehrenkreuz der Bundeswehr für Tapferkeit.</p>`},
 {id:'gliederung',t:'Vom Trupp zur Division',d:'Ebenen, Größen und wer sie führt',deck:'gl',b:()=>`
  <p>Die Bundeswehr ist in Ebenen gegliedert, die jeweils mehrere Elemente der Ebene darunter bündeln. Ab der Kompanie wächst die Größe nicht mehr gleichmäßig, weil Fahrzeuge, Waffensysteme und Unterstützungspersonal den Umfang bestimmen.</p>
  <ol class="ladder">${GL.map(r=>`<li><strong>${esc(r.e)}</strong><span>${esc(r.n)}. ${esc(r.f)}.</span></li>`).join('')}</ol>
  <p>Die vier Sammelbegriffe tauchen ständig auf: Teileinheit (Trupp bis Zug), Einheit (Kompanie, Batterie, Staffel), Verband (ab Bataillon) und Großverband (ab Brigade).</p>
  <p>Auch die Führungsbezeichnung verrät die Ebene: Teileinheiten haben einen Führer (Gruppenführer, Zugführer), die Kompanie hat einen Chef, ab dem Bataillon führt ein Kommandeur. Der Kompaniechef hat nach der Wehrdisziplinarordnung die unterste Stufe der Disziplinarbefugnis.</p>
  <div class="callout">Luftwaffe und Marine benennen dieselben Ebenen anders. Die Kompanie heißt in der Luftwaffe Staffel, in der Marine entspricht ihr die Besatzung eines Bootes. Ein Geschwader steht auf Regimentsebene. Die Tabelle unter Nachschlagen zeigt alle Entsprechungen.</div>
  <h3>Die Großverbände</h3>
  <p>Das Heer hat vier Divisionen: die 1. Panzerdivision (Stab in Oldenburg), die 10. Panzerdivision (Veitshöchheim), zu der auch die Panzerbrigade 45 in Litauen gehört, die Division Schnelle Kräfte (Stadtallendorf) mit Fallschirmjägern und Kommando Spezialkräfte sowie seit 2025 die Heimatschutzdivision (Berlin). Die Marine führt ihre Schiffe und Boote in zwei Einsatzflottillen, in Kiel und in Wilhelmshaven.</p>
  <p>Über der Division endet die deutsche Gliederung. Die Divisionen führt das Kommando Heer in Strausberg, eine Führungsbehörde, kein Großverband. Korps gibt es nur noch multinational: Deutsche Truppen gehören etwa zum 1. Deutsch-Niederländischen Korps in Münster, zum Multinationalen Korps Nordost in Stettin und zum Eurokorps in Straßburg.</p>`},
 {id:'zeichen',t:'NATO-Größenzeichen',d:'Taktische Zeichen auf Lagekarten lesen',deck:'sym',b:()=>`
  <p>Auf Lagekarten und in Lagebildern stehen Truppenteile als taktische Zeichen nach dem NATO-Standard APP-6. Der Rahmen zeigt die Art (das Kreuz steht für Infanterie), das Zeichen darüber die Größe.</p>
  ${syms([['●','Trupp'],['●●','Gruppe'],['●●●','Zug'],['I','Kompanie'],['II','Bataillon'],['III','Regiment'],['X','Brigade'],['XX','Division'],['XXX','Korps'],['XXXX','Armee']])}
  <p>Die Logik: Punkte für Teileinheiten, senkrechte Striche von der Kompanie bis zum Regiment, Kreuze ab der Brigade, bis zu Korps (XXX) und Armee (XXXX). Die Zuordnung von Trupp und Gruppe zu einem und zwei Punkten folgt der deutschen Lesart; APP-6 kennt darunter noch Team oder Besatzung (Ø).</p>`},
 {id:'staebe',t:'Stäbe und Stabsabteilungen',d:'Wer im Stab wofür zuständig ist',deck:'stab',b:()=>`
  <p>Ein Kommandeur führt, sein Stab bereitet Entscheidungen vor und setzt sie um. Der Stab ist in nummerierte Abteilungen gegliedert. Die Nummer bedeutet überall dasselbe:</p>
  <ol class="ladder">${STAB.map(([k,v])=>`<li><strong>${k.slice(1)}</strong><span>${esc(v)}</span></li>`).join('')}</ol>
  <p>Der Buchstabe davor zeigt die Ebene oder den Stabstyp: S im Bataillon, G auf höheren Ebenen des Heeres, A für die Luftwaffe, N für die Marine, J in streitkräftegemeinsamen Stäben. Ein Bataillon hat typischerweise nur S1 bis S6, dort umfasst die S3 auch die Ausbildung.</p>`},
 {id:'buendnis',t:'Im Bündnis: NATO, EU und Heimatschutz',d:'Artikel 5, NATO-Kommandostruktur, Litauen und Drehscheibe Deutschland',deck:'nato',b:()=>`
  <p>Deutschland verteidigt sich nicht allein. Die NATO wurde 1949 gegründet, die Bundesrepublik trat 1955 bei. Heute hat das Bündnis 32 Mitglieder. Kern ist Artikel 5 des Nordatlantikvertrags: Ein bewaffneter Angriff auf einen Mitgliedstaat gilt als Angriff auf alle. Jeder Staat leistet Beistand mit den Maßnahmen, die er für erforderlich hält. Ausgerufen wurde der Bündnisfall bisher einmal, nach dem 11. September 2001. Artikel 4 sieht Konsultationen vor, wenn sich ein Mitglied bedroht sieht.</p>
  <h3>Wie die NATO geführt wird</h3>
  <ol class="ladder">
   <li><strong>Nordatlantikrat</strong><span>Politisches Entscheidungsgremium in Brüssel, entscheidet im Konsens.</span></li>
   <li><strong>SHAPE</strong><span>Militärisches Hauptquartier in Mons (Belgien). Dort führt der SACEUR, traditionell ein US-Offizier, das Allied Command Operations.</span></li>
   <li><strong>ACT</strong><span>Allied Command Transformation in Norfolk (USA), entwickelt die NATO weiter.</span></li>
   <li><strong>JFC</strong><span>Drei operative Hauptquartiere in Brunssum, Neapel und Norfolk.</span></li>
   <li><strong>JSEC</strong><span>In Ulm, koordiniert Verlegung und Schutz von Truppen im rückwärtigen Raum Europas.</span></li>
  </ol>
  <p>Seit 2023 plant die NATO ihre Kräfte nach dem NATO-Streitkräftemodell in drei Stufen: rund 100.000 Soldatinnen und Soldaten in bis zu zehn Tagen, weitere rund 200.000 in 10 bis 30 Tagen und mindestens 500.000 in bis zu sechs Monaten. Die Kräfte sind festen Verteidigungsplänen zugeordnet.</p>
  <h3>Deutschlands Beitrag an der Ostflanke</h3>
  <p>Seit 2017 führt Deutschland den multinationalen Gefechtsverband der enhanced Forward Presence (eFP) in Litauen. Am 1. April 2025 wurde in Vilnius die Panzerbrigade 45 in Dienst gestellt, die erste dauerhaft im Ausland stationierte Brigade der Bundeswehr. Bis 2027 soll sie voll einsatzbereit sein.</p>
  <h3>Drehscheibe Deutschland und Heimatschutz</h3>
  <p>Wegen seiner Lage in der Mitte Europas ist Deutschland im Bündnisfall Transitland für verbündete Truppen. Dafür leistet es Host Nation Support: Unterkunft, Verpflegung, Betankung, Transport und Schutz. Wie militärische und zivile Stellen dabei zusammenwirken, legt der eingestufte Operationsplan Deutschland (OPLAN DEU) fest, koordiniert vom Operativen Führungskommando.</p>
  <p>Den Schutz von Verlegewegen und kritischer Infrastruktur übernehmen die Heimatschutzkräfte. Seit 2025 führt sie die Heimatschutzdivision des Heeres mit Heimatschutzregimentern aus Reservisten und aktiven Soldaten. In jedem Bundesland gibt es außerdem ein Landeskommando als Bindeglied zu Landesregierung und Behörden.</p>
  <div class="callout">Auch die EU hat eine Beistandsklausel: Art. 42 Abs. 7 EU-Vertrag, Teil der Gemeinsamen Sicherheits- und Verteidigungspolitik (GSVP). Angewendet wurde sie bisher einmal, auf Bitte Frankreichs nach den Anschlägen von Paris 2015.</div>`},
 {id:'kuerzel',t:'Abkürzungen im Dienstalltag',d:'Von AGA bis DZE, dazu Dienstgrade in Kurzform',deck:'abk',b:()=>`
  <p>Die Bundeswehr kürzt fast alles ab. Wer die häufigsten Kürzel kennt, versteht Dienstpläne, Befehle und Gespräche deutlich besser. Eine Auswahl:</p>
  <ol class="ladder">${GLOSS[0].items.filter(([k])=>['AGA','KzH','DZE','UvD','GvD','KpFw','SaZ','BS','FWDL','RDL'].includes(k)).map(([k,v])=>`<li><strong>${esc(k)}</strong><span>${esc(v)}</span></li>`).join('')}</ol>
  <p>Auch Dienstgrade werden abgekürzt, im Schriftverkehr steht die Abkürzung vor dem Namen, etwa „OTL Müller“ oder „Hptm Schmidt“. Die Kürzel folgen meist den Bausteinen: O für Ober, St für Stabs, Hpt für Haupt. So wird aus Oberstabsfeldwebel OStFw. Ausnahmen sind OTL für Oberstleutnant und O für Oberst.</p>
  <div class="callout">KzH ist keine Krankmeldung im zivilen Sinn. Soldatinnen und Soldaten werden truppenärztlich versorgt, und der Truppenarzt entscheidet, ob jemand zu Hause gesund werden darf.</div>
  <h3>Buchstabieren und Zeitangaben</h3>
  <p>Am Funk und am Telefon wird mit dem NATO-Buchstabieralphabet buchstabiert, meist kurz NATO-Alphabet genannt: Alfa, Bravo, Charlie, Delta und so weiter bis Zulu. Alfa und Juliett werden bewusst so geschrieben, damit sie in allen Sprachen gleich ausgesprochen werden. Die vollständige Liste steht unter Nachschlagen.</p>
  <p>Zeitpunkte stehen in Befehlen und Meldungen als Datum-Zeit-Gruppe (DTG): Tag, Uhrzeit, Zeitzone, Monat, Jahr. 031430ZOCT26 heißt 3. Oktober 2026, 14:30 Uhr. Der Buchstabe nennt die Zeitzone, ebenfalls nach dem Buchstabieralphabet: Z (Zulu) ist die koordinierte Weltzeit UTC, A (Alfa) die deutsche Winterzeit, B (Bravo) die Sommerzeit, J (Juliett) die Ortszeit.</p>`},
 {id:'geheimschutz',t:'Geheimschutz: VS und SÜ',d:'Geheimhaltungsgrade, Sicherheitsüberprüfung und VSA',deck:'vs',b:()=>`
  <p>Informationen, die im öffentlichen Interesse geheim bleiben müssen, sind Verschlusssachen (VS). Das Sicherheitsüberprüfungsgesetz (SÜG) kennt vier Geheimhaltungsgrade. Je höher der Grad, desto gründlicher die Sicherheitsüberprüfung (SÜ), die Voraussetzung für den Zugang ist:</p>
  <ol class="ladder">
   <li><strong>VS – Nur für den Dienstgebrauch</strong><span>Keine SÜ, aber Belehrung über den Umgang. NATO RESTRICTED.</span></li>
   <li><strong>VS – Vertraulich</strong><span>Ü1, einfache SÜ. NATO CONFIDENTIAL.</span></li>
   <li><strong>GEHEIM</strong><span>Ü2, erweiterte SÜ. NATO SECRET.</span></li>
   <li><strong>STRENG GEHEIM</strong><span>Ü3, erweiterte SÜ mit Sicherheitsermittlungen. COSMIC TOP SECRET.</span></li>
  </ol>
  <p>Wer sehr viele Unterlagen eines Grades bearbeitet, braucht die nächsthöhere Überprüfung: bei vielen VS-VERTRAULICH eine Ü2, bei vielen GEHEIM eine Ü3. Im Geschäftsbereich des BMVg wirkt der MAD an der Überprüfung mit, sonst meist das Bundesamt für Verfassungsschutz.</p>
  <p>Wie mit VS praktisch umzugehen ist, also Kennzeichnung, Aufbewahrung, Weitergabe und Vernichtung, regelt die Verschlusssachenanweisung (VSA). Für Unternehmen gilt das Geheimschutzhandbuch (GHB) des Bundesministeriums für Wirtschaft und Energie, ab VS-VERTRAULICH braucht eine Firma einen Sicherheitsbescheid.</p>
  <div class="callout">Eine SÜ berechtigt nicht automatisch zum Lesen. Es gilt „Kenntnis nur, wenn nötig“: Zugang erhält nur, wer die VS für die eigene Aufgabe braucht.</div>`},
 {id:'beschaffung',t:'Wer braucht, wer beschafft',d:'Bedarfsträger, Bedarfsdecker und die wichtigsten Stellen',deck:'beh',b:()=>`
  <p>Die Bundeswehr trennt zwei Rollen. Der Bedarfsträger formuliert, was gebraucht wird. Der Bedarfsdecker beschafft es. Das zentrale Verfahren heißt Customer Product Management (CPM) und betrachtet ein Produkt über den gesamten Lebenszyklus.</p>
  <ol class="ladder">
   <li><strong>BAAINBw</strong><span>Zivile Bundesoberbehörde in Koblenz, Bedarfsdecker der Streitkräfte. Größere Vorhaben laufen über CPM, betriebsbedingte Bedarfe über den Einkauf der Bundeswehr.</span></li>
   <li><strong>BWI</strong><span>IT-Systemhaus der Bundeswehr, hundertprozentige Bundesgesellschaft. Betreibt und modernisiert die IT der Bundeswehr.</span></li>
   <li><strong>ZDigBw</strong><span>Dem Kommando CIR unterstellt, Bedarfsträger für das Teilportfolio Cyber/IT.</span></li>
   <li><strong>CIHBw</strong><span>Cyber Innovation Hub, seit 2020 Abteilung der BWI. Testet neue Lösungen mit Nutzern aus der Truppe und übergibt Erfolgreiches an das ZDigBw zur Einführung.</span></li>
   <li><strong>BMWE</strong><span>Das Bundesministerium für Wirtschaft und Energie ist nach § 25 SÜG für den Geheimschutz in Unternehmen zuständig, also für den Sicherheitsbescheid, den eine Firma für eingestufte Aufträge braucht.</span></li>
  </ol>
  <p>Auf der anderen Seite steht die Sicherheits- und Verteidigungsindustrie (SVI). Große europäische Vorhaben sind etwa FCAS, das Luftkampfsystem der nächsten Generation, und MGCS, das deutsch-französische Landkampfsystem. Die Industrie organisiert sich in Verbänden wie BDSV und BDLI. Gesellschaften wie DWT, Förderkreis Deutsches Heer (FKH) oder Deutsches Maritimes Institut (DMI) bringen Streitkräfte, Verwaltung, Politik und Industrie ins Gespräch. In der NATO berät die NIAG aus Sicht der Industrie.</p>
  <h3>Woher das Geld kommt</h3>
  <p>Der Verteidigungshaushalt ist der Einzelplan 14 im Bundeshaushalt, beschlossen vom Bundestag. Vorhaben ab 25 Millionen Euro legt das BMVg vorher dem Haushaltsausschuss vor, die sogenannten 25-Millionen-Vorlagen. 2022 kam das kreditfinanzierte Sondervermögen Bundeswehr über 100 Milliarden Euro hinzu. Seit einer Grundgesetzänderung im März 2025 sind Verteidigungsausgaben oberhalb von 1 % des Bruttoinlandsprodukts von der Schuldenbremse ausgenommen.</p>
  <div class="callout">Lange galt in der NATO das Ziel, 2 % des BIP für Verteidigung auszugeben. Auf dem Gipfel in Den Haag 2025 vereinbarten die Verbündeten 5 % bis 2035: 3,5 % für die Kernverteidigung und 1,5 % für verteidigungsrelevante Infrastruktur und Resilienz.</div>`},
 {id:'digital',t:'Führung digital: von C2 bis MDO',d:'C4ISR, Multi-Domain, Core, Fog, Edge und offene Architekturen',deck:'dig',b:()=>`
  <p>Viele Begriffe der militärischen Digitalisierung stammen aus NATO und US-Streitkräften und werden auch im Deutschen auf Englisch verwendet. Die C-Kürzel bauen aufeinander auf:</p>
  <ol class="ladder">
   <li><strong>C2</strong><span>Command and Control, also Führung.</span></li>
   <li><strong>C3</strong><span>In der NATO Consultation, Command and Control. Die NATO-C3-Taxonomie ordnet danach Fähigkeiten, Dienste und Systeme.</span></li>
   <li><strong>C4I</strong><span>Dazu Communications, Computers und Intelligence.</span></li>
   <li><strong>C4ISR</strong><span>Dazu Surveillance und Reconnaissance: Führung und Aufklärung als Gesamtsystem.</span></li>
  </ol>
  <p>Multi-Domain Operations (MDO) meint das koordinierte Vorgehen über alle Dimensionen: Land, Luft, See, Weltraum sowie Cyber- und Informationsraum. Dazu gehört das elektromagnetische Spektrum, in dem EMSO stattfinden, darunter die Elektronische Kampfführung (EloKa). Im Jargon heißen Waffensysteme oft Wirksysteme, und „wirken“ steht für den Waffeneinsatz.</p>
  <h3>Core, Fog, Edge</h3>
  <p>Die IT der Bundeswehr wird in Ebenen beschrieben. Core sind die großen Rechenzentren, darunter die private Cloud der Bundeswehr (pCloudBw). Fog sind die IT-Systeme der obersten taktischen Ebene, etwa digitale Gefechtsstände. Edge ist die IT einzelner Waffensysteme, etwa an Bord einer Fregatte. Für die Landstreitkräfte steht das Vorhaben D-LBO, Digitalisierung landbasierter Operationen.</p>
  <h3>Offene Architekturen</h3>
  <p>Damit Systeme verschiedener Hersteller zusammenpassen und sich modernisieren lassen, setzen Streitkräfte auf offene Standards. MOSA ist der übergreifende Ansatz des US-Verteidigungsministeriums, SOSA standardisiert Sensorik, FACE die Avionik-Software, NGVA (STANAG 4754) Landfahrzeuge. Software Defined Defence (SDD) entkoppelt Software von Hardware, sodass neue Fähigkeiten per Update kommen können. cATO ersetzt die einmalige Betriebszulassung durch eine laufende.</p>
  <div class="callout">Die Kürzel sind nicht immer einheitlich: C3 heißt in der NATO Consultation, Command and Control, anderswo Command, Control, Communications. Im Zweifel nachfragen, welche Lesart gemeint ist.</div>`}
];

/* ---------- Speicher ---------- */
const KEY='agademy:v1';
let store={box:{},read:{}};
try{const s=localStorage.getItem(KEY);if(s) store=JSON.parse(s)||store;if(!store.box) store.box={};if(!store.read) store.read={}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const boxOf=c=>store.box[c.id]||0;
const setBox=(c,b)=>{store.box[c.id]=Math.max(0,Math.min(4,b));save()};

/* ---------- Zustand ---------- */
let glossQ='', lesson=null, mode='basics', deck='all', refTab='dg', hl='heer', last=null, cur=null, revealed=false, quiz=null;
const pool=()=>deck==='all'?CARDS:CARDS.filter(c=>c.deck===deck);
const deckName=id=>(DECKS.find(d=>d.id===id)||{}).name;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function pick(){
  const p=pool().filter(c=>c!==last);
  const ws=p.map(c=>Math.pow(2,4-boxOf(c)));let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<p.length;i++){r-=ws[i];if(r<=0) return p[i]}
  return p[0];
}
function distractors(c,n=3){
  if(Array.isArray(c.extra)) return c.extra.slice(0,n);
  // nur Karten derselben Art im selben Stapel, ohne Einzelfragen mit eigenen Antworten
  const same=CARDS.filter(x=>x.deck===c.deck&&x.kind===c.kind&&!Array.isArray(x.extra)&&x.a!==c.a).map(x=>x.a);
  return shuffle([...new Set(same)]).slice(0,n);
}
function answerHTML(c,a){
  if(c.kind.startsWith('abzrev')) return insignia(a,44);
  if((c.kind==='wf'||c.kind==='bar')&&SWATCH[a]) return `${dot(SWATCH[a])}<span>${esc(a)}</span>`;
  if(c.kind==='symrev') return `<span style="color:var(--frame)">${unitSym(a,48)}</span><span>${esc(a)}</span>`;
  return esc(a);
}
function questionHTML(c){
  let h=`<p class="q">${esc(c.q)}</p>`;
  if(c.extra&&c.extra.ins) h+=`<div class="fig">${insignia(c.extra.ins,84)}</div>`;
  if(c.kind==='sym') h+=`<div class="fig" style="color:var(--frame)">${unitSym(c.extra.sym,96)}</div>`;
  return h;
}

/* ---------- Ansichten ---------- */
const sure=cs=>cs.filter(c=>boxOf(c)>=3).length;
function topicRows(){
  return [{id:'all',name:'Alle Themen'},...DECKS].map(d=>{const cs=d.id==='all'?CARDS:CARDS.filter(c=>c.deck===d.id);const k=sure(cs);
    return {id:d.id,name:d.name,n:cs.length,k,pct:Math.round(100*k/cs.length)}});
}
function renderDecks(){
  const b=document.getElementById('topicBtn');
  b.hidden=!(mode==='learn'||mode==='quiz');
  const r=topicRows().find(x=>x.id===deck);
  b.innerHTML=`<span class="t"><span class="k">Thema</span><span class="n">${esc(r.name)}</span>
    <span class="k">${r.n} Karten, ${r.k} sicher</span><span class="bar"><i style="width:${r.pct}%"></i></span></span>
    <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>`;
  b.setAttribute('aria-label','Thema wählen, aktuell '+r.name);
}
function openSheet(){
  document.getElementById('tlist').innerHTML=topicRows().map(r=>`<li><button data-deck="${r.id}" aria-current="${r.id===deck}">
    <span class="row"><span class="nm">${esc(r.name)}</span><span class="ct">${r.k} von ${r.n} sicher</span></span>
    <span class="bar"><i style="width:${r.pct}%"></i></span></button></li>`).join('');
  const d=document.getElementById('sheet');
  if(d.showModal) d.showModal(); else d.setAttribute('open','');
}
function closeSheet(){const d=document.getElementById('sheet');if(d.close) d.close(); else d.removeAttribute('open')}
function boxesHTML(){
  const p=pool();const counts=[0,0,0,0,0];p.forEach(c=>counts[boxOf(c)]++);
  return `<div class="boxes" aria-label="Lernstand nach Fächern">${counts.map((n,i)=>`<div><span class="${n?'f':''}" style="opacity:${n?0.35+0.65*i/4:1}"></span><b>${n}</b>Fach ${i+1}</div>`).join('')}</div>`;
}
function renderLearn(){
  if(!cur){cur=pick();revealed=false}
  const c=cur;const d=DECKS.find(x=>x.id===c.deck);
  const ans=revealed?`<div class="ans"><p class="a">${c.kind==='symrev'||c.kind.startsWith('abzrev')?'':esc(c.a)}</p>${c.kind.startsWith('abzrev')?`<div class="fig">${insignia(c.a,84)}</div>`:''}${c.kind==='symrev'?`<div class="fig" style="color:var(--frame)">${unitSym(c.a,72)}</div>`:''}${c.note?`<p class="note">${esc(c.note)}</p>`:''}</div>`:'';
  const act=revealed?`<div class="actions"><button class="btn again" data-act="again">Nochmal</button><button class="btn ok" data-act="ok">Gewusst</button></div>`
                    :`<div class="actions"><button class="btn primary" data-act="reveal">Antwort zeigen</button></div>`;
  return `<div class="card"><p class="deckname">${esc(d.name)}, Fach ${boxOf(c)+1} von 5</p>${questionHTML(c)}${ans}</div>${act}${boxesHTML()}`;
}
function newQuiz(){
  const qs=shuffle(pool()).slice(0,10).map(c=>({c,opts:shuffle([c.a,...distractors(c)]),chosen:null}));
  quiz={qs,i:0,score:0};
}
function renderQuiz(){
  if(!quiz) newQuiz();
  if(quiz.i>=quiz.qs.length){
    return `<div class="card">
      <p class="deckname">Ergebnis</p><p class="score">${quiz.score} / ${quiz.qs.length}</p>
      <p class="note">Falsch beantwortete Karten liegen jetzt wieder in Fach 1.</p></div>
      <div class="actions"><button class="btn primary" data-act="newquiz">Neue Runde</button></div>`;
  }
  const q=quiz.qs[quiz.i];const done=q.chosen!==null;const d=DECKS.find(x=>x.id===q.c.deck);
  const isImg=q.c.kind.startsWith('abzrev');
  const opts=q.opts.map((o,k)=>{let cls='opt';if(done){if(o===q.c.a)cls+=' right';else if(k===q.chosen)cls+=' wrong'}
    return `<button class="${cls}" data-opt="${k}" ${done?'disabled':''}>${answerHTML(q.c,o)}</button>`}).join('');
  return `<div class="card">
     <p class="deckname">Frage ${quiz.i+1} von ${quiz.qs.length}, ${esc(d.name)}</p>${questionHTML(q.c)}
     ${done&&q.c.note?`<p class="note" style="margin-top:14px">${esc(q.c.note)}</p>`:''}</div>
     <div class="opts${isImg?' img':''}">${opts}</div>
     ${done?`<div class="actions"><button class="btn primary" data-act="next">${quiz.i+1<quiz.qs.length?'Nächste Frage':'Ergebnis zeigen'}</button></div>`:''}`;
}
const insFig=(t,n)=>`<figure>${insignia(t+':'+n,52)}<figcaption>${esc(n)}</figcaption></figure>`;
function insGrid(t){
  let h='';
  for(const [lg,subs] of INSGRP){
    h+=`<h3 class="lg">${lg}</h3>`;
    for(const [g,a,b] of subs) h+=`${g!==lg?`<h4 class="dgg">${esc(g)}</h4>`:''}<div class="insgrid">${INS[t].slice(a,b).map(([n])=>insFig(t,n)).join('')}</div>`;
  }
  return h;
}
const hlGrid=()=>insGrid(hl), sanGrid=()=>INS.san.map(([n])=>insFig(hl==='lw'?'sanlw':'san',n)).join('');
const hlSeg=`<div class="seg sm" role="group" aria-label="Teilstreitkraft"><button data-hl="heer">Heer</button><button data-hl="lw">Luftwaffe</button></div>`;
function setHl(t){ // Heer/Luftwaffe umschalten, ohne die Seite neu aufzubauen
  hl=t;
  document.querySelectorAll('[data-hl]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.hl===hl));
  const g=document.getElementById('hlgrid');if(g) g.innerHTML=hlGrid();
  const s=document.getElementById('sangrid');if(s) s.innerHTML=sanGrid();
}
function renderRef(){
  const tabs=[['dg','Dienstgrade'],['abz','Abzeichen'],['gl','Gliederung'],['stab','Stäbe'],['beh','Begriffe']];
  let h=`<div class="seg" role="group" aria-label="Nachschlagen">${tabs.map(([k,n])=>`<button data-ref="${k}" aria-pressed="${refTab===k}">${n}</button>`).join('')}</div>`;
  const jump=secs=>`<nav class="jump" aria-label="Springe zu">${secs.map(([id,n])=>`<button class="chip" data-jump="${id}">${esc(n)}</button>`).join('')}</nav>`;
  if(refTab==='dg'){
    let rows='',g='';
    RANKS.forEach(r=>{if(r.g!==g){g=r.g;rows+=`<tr class="grp"><td colspan="3">${esc(g)}</td></tr>`}
      rows+=`<tr><td>${esc(r.h)}</td><td>${esc(r.m)}</td><td>${r.n}</td></tr>`});
    h+=`<div class="scroll"><table><thead><tr><th>Heer, Luftwaffe</th><th>Marine</th><th>NATO</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small">Sanitätsoffiziere: ${SAN.map(([e,s])=>`${s} (wie ${e})`).join(', ')}.</p>`;
  } else if(refTab==='abz'){
    h+=jump([['heer','Heer & Luftwaffe'],['marine','Marine'],['sanitaet','Sanität'],['waffenfarben','Waffenfarben'],['barett','Barett']]);
    for(const [t,lbl,id] of [['hl','Heer und Luftwaffe (Feldanzug)','heer'],['mar','Marine','marine']]){
      h+=`<h2 id="${id}">${lbl}</h2>`;
      if(t==='hl') h+=hlSeg+`<div id="hlgrid">${hlGrid()}</div>`;else h+=insGrid(t);
    }
    h+=`<h2 id="sanitaet">Sanitätsoffiziere (Feldanzug)</h2>
    <p class="small">Ärzte und Zahnärzte tragen den Äskulapstab über den Sternen, in der Marine über den Ärmelstreifen.</p>
    ${hlSeg}<div class="insgrid" id="sangrid">${sanGrid()}</div>
    <div class="scroll"><table><thead><tr><th>Heer, Luftwaffe</th><th>Marine</th><th>Ebene</th></tr></thead><tbody>${SAN.map(([e,n],i)=>`<tr><td>${esc(n)}</td><td>${esc(SANM[i])}</td><td>${esc(e)}</td></tr>`).join('')}</tbody></table></div>
    <p class="small">Apotheker und Veterinäre führen eigene Bezeichnungen, z. B. Stabsapotheker oder Stabsveterinär.</p>`;
    h+=`<h2 id="waffenfarben">Waffenfarben (Heer)</h2>
    <div class="scroll"><table><thead><tr><th></th><th>Waffenfarbe</th><th>Truppengattung</th></tr></thead><tbody>
    ${[...WAFF.map(([f,c,t,n])=>[c,f,t,n]),['gen','Hochrot mit Gold','Generale']].map(([c,f,t,n])=>`<tr><td class="sym">${collar(c,24)}</td><td><strong>${esc(f)}</strong></td><td>${esc(t)}${n?`<br><span class="small">${esc(n)}</span>`:''}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="small">Am Feldanzug als Litze an den Schulterklappen, am Dienstanzug als Kragenspiegel und Umrandung der Schulterklappen. Luftwaffe und Marine haben keine Waffenfarben.</p>
    <h2 id="barett">Barettfarben</h2>
    <div class="scroll"><table><thead><tr><th></th><th>Barett</th><th>Getragen von</th></tr></thead><tbody>
    ${BARETT.map(([f,c,ts])=>`<tr><td class="sym">${dot(c)}</td><td><strong>${esc(f)}</strong></td><td>${ts.map(esc).join(', ')}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="small">Das Barettabzeichen zeigt die genaue Truppengattung. Gebirgsjäger tragen die Bergmütze, der Militärmusikdienst trägt sein Abzeichen zu unterschiedlichen Barettfarben. Quelle: BMVg, Bekleidung und Uniformen der Bundeswehr (Stand April 2026).</p>`;
  } else if(refTab==='gl'){
    h+=`<div class="scroll"><table><thead><tr><th></th><th>Heer</th><th>Stärke</th><th>Luftwaffe</th><th>Marine</th><th>Führung (typisch)</th></tr></thead><tbody>
    ${GL.map(r=>`<tr><td class="sym">${unitSym(r.s,44)}</td><td><strong>${esc(r.e)}</strong></td><td>${esc(r.n)}</td><td>${esc(r.lw)}</td><td>${esc(r.mar)}</td><td>${esc(r.f)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="small">Teileinheit: Trupp bis Zug. Einheit: Kompanie, Batterie, Staffel. Verband: ab Bataillon. Großverband: ab Brigade. Darüber im NATO-Rahmen Korps (XXX) und Armee (XXXX).</p>`;
  } else if(refTab==='stab'){
    h+=`<dl>${STAB.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    <p class="small">Präfixe: ${PRE.map(([k,v])=>`${k} ${esc(v)}`).join('; ')}. Die Nummer bleibt gleich, der Buchstabe zeigt Ebene oder Teilstreitkraft: Ein Bataillon hat typischerweise S1 bis S6 (S3 dort inkl. Ausbildung), J1 bis J9 voll ausgeprägt gibt es in streitkräftegemeinsamen Stäben.</p>`;
  } else {
    const dl=(id,t,items)=>`<section class="gloss" id="${id}"><h3 class="lg">${esc(t)}</h3><dl>${items.map(([k,v,n])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}${n?'<br>'+esc(n):''}</dd></div>`).join('')}</dl></section>`;
    h+=`<input type="search" id="gq" class="search" placeholder="Abkürzung oder Begriff suchen" aria-label="Begriffe durchsuchen" value="${esc(glossQ)}">
    ${jump([['behoerden','Behörden'],...GLOSS.map(g=>[g.id,g.nav||g.t])])}
    ${dl('behoerden','Behörden & Dienststellen',BEH)}${GLOSS.map(g=>dl(g.id,g.t,g.items)).join('')}<p class="small" id="gnone" hidden>Nichts gefunden.</p>`;
  }
  return h;
}
function renderBasics(){
  if(lesson){
    const i=LESSONS.findIndex(l=>l.id===lesson);const L=LESSONS[i];store.read[L.id]=1;save();
    const pv=LESSONS[i-1],nx=LESSONS[i+1];
    return `<div class="lesson"><button class="back" data-lesson="">Alle Lektionen</button>
      <p class="small" style="margin:10px 0 0">Lektion ${i+1} von ${LESSONS.length}</p><h2>${esc(L.t)}</h2>${L.b()}
      <div class="actions"><div class="duo"><button class="btn ok" data-practice="${L.deck}">Lernkarten dazu üben</button><button class="btn primary" data-practice="${L.deck}" data-pm="quiz">Quiz dazu</button></div>
      <div class="pager">${pv?`<button class="btn ghost prev" data-lesson="${pv.id}"><small>Zurück</small>${esc(pv.t)}</button>`:''}
      ${nx?`<button class="btn ghost next" data-lesson="${nx.id}"><small>Weiter</small>${esc(nx.t)}</button>`:''}</div></div></div>`;
  }
  const n=LESSONS.filter(l=>store.read[l.id]).length;
  return `<p class="intro">${LESSONS.length} kurze Lektionen vermitteln das Grundwissen. Danach festigen Lernkarten und Quiz das Gelernte. ${n} von ${LESSONS.length} gelesen.</p>
   <ol class="lessons">${LESSONS.map((l,i)=>`<li><button data-lesson="${l.id}"><span class="num${store.read[l.id]?' done':''}" aria-label="${store.read[l.id]?'gelesen':'ungelesen'}">${i+1}</span>
   <span><span class="lt">${esc(l.t)}</span><span class="ld">${esc(l.d)}</span></span></button></li>`).join('')}</ol>`;
}
let installEvt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render()});
addEventListener('appinstalled',()=>{installEvt=null;render()});
function install(){ // Browser mit eigenem Dialog fragen direkt, sonst führt der Knopf zur Anleitung in der Hilfe
  if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}
  else go('#/hilfe/app');
}
function renderHelp(){
  const n=CARDS.length;
  return `<div class="help"><button class="back" data-back="1">Zurück zu ${{basics:'Grundlagen',learn:'Lernkarten',quiz:'Quiz',ref:'Nachschlagen'}[MODES[helpFrom.split('/')[1]]]}</button>
  <h2>Was ist AGAdemy?</h2>
  <p>AGA steht für Allgemeine Grundausbildung. AGAdemy ist die zivile Variante: für alle, die mit der Bundeswehr zusammenarbeiten und ihre Sprache und Strukturen verstehen wollen.</p>
  <div class="callout"><strong>Kein Angebot der Bundeswehr.</strong> AGAdemy ist ein privates Projekt. Es ist kein Angebot, keine Veröffentlichung und keine offizielle Anwendung der Bundeswehr, des Bundesministeriums der Verteidigung oder einer anderen Dienststelle und steht mit ihnen in keiner Verbindung. Alle Inhalte beruhen auf öffentlich zugänglichen Quellen und können Fehler enthalten. Verbindlich sind allein die offiziellen Quellen. Fehler gefunden? Gern als <a href="https://github.com/FlorianWilhelm/agademy/issues">Issue auf GitHub</a> melden.</div>
  <h2>Inhalte der App</h2>
  <p>Grundwissen über die Bundeswehr: ihre Stellung im Staat, NATO und Heimatschutz, Dienstgrade und Abzeichen, Uniformen, Waffen- und Barettfarben, Gliederung, Stabsabteilungen, Behörden und Haushalt, Anrede, Abkürzungen, NATO-Alphabet, Geheimschutz und die Begriffe der militärischen Digitalisierung. Insgesamt ${n} Karten in ${DECKS.length} Themen.</p>
  <h3>Grundlagen</h3>
  <p>${LESSONS.length} Lektionen vermitteln das Wissen in sinnvoller Reihenfolge, mit Beispielen und Abzeichen. Am Ende jeder Lektion führen „Lernkarten dazu üben“ und „Quiz dazu“ direkt zum passenden Thema. Gelesene Lektionen sind markiert.</p>
  <h3>Thema wählen</h3>
  <p>Oben bei Lernkarten und Quiz steht das aktuelle Thema. Antippen öffnet die Liste aller Themen mit ihrem Lernstand. „Alle Themen“ mischt alles.</p>
  <h3>Lernkarten</h3>
  <p>Frage lesen, selbst antworten, dann „Antwort zeigen“. Mit „Gewusst“ wandert die Karte ein Fach weiter, mit „Nochmal“ zurück in Fach 1. Es gibt fünf Fächer. Karten in niedrigen Fächern kommen häufiger dran, so üben Sie vor allem, was noch nicht sitzt. Ab Fach 4 zählt eine Karte als sicher.</p>
  <p>Am Rechner geht es auch per Tastatur: Leertaste zeigt die Antwort, 1 für Nochmal, 2 für Gewusst.</p>
  <h3>Quiz</h3>
  <p>Zehn Fragen mit je vier Antworten aus dem gewählten Thema. Bei Abzeichen-Fragen sind die Antworten Bilder. Richtige Antworten schieben die Karte ein Fach weiter, falsche zurück in Fach 1, Quiz und Lernkarten teilen sich also denselben Lernstand.</p>
  <h3>Nachschlagen</h3>
  <p>Übersichten zum schnellen Nachsehen: Dienstgradleiter mit Marine-Entsprechung und NATO-Rangcode, alle Abzeichen, Gliederung mit NATO-Größenzeichen, Stabsabteilungen und ein durchsuchbares Verzeichnis aller Abkürzungen samt NATO-Alphabet. Die Leiste „Springe zu“ führt direkt zu jedem Abschnitt.</p>
  <h2>Wie belastbar die Inhalte sind</h2>
  <p>Dienstgrade, Gliederung und Behördenangaben stammen von bundeswehr.de, Abzeichen und Dienstgradbezeichnungen aus der Anordnung des Bundespräsidenten über die Dienstgradbezeichnungen und die Uniform (2021), Waffen- und Barettfarben aus der BMVg-Broschüre „Bekleidung und Uniformen der Bundeswehr“ (April 2026), Rechtsrahmen aus Grundgesetz, Soldatengesetz, Parlamentsbeteiligungsgesetz und Wehrdienst-Modernisierungsgesetz, NATO-Angaben von nato.int, Disziplinarbefugnis aus der Wehrdisziplinarordnung, Geheimschutz aus dem SÜG und der VSA, Architekturbegriffe u. a. nach Fraunhofer IESE. NATO-Rangcodes folgen STANAG 2116, Größenzeichen NATO APP-6 in deutscher Lesart. Die Abzeichen sind nach der Anordnung des Bundespräsidenten vereinfacht nachgezeichnet. Stärkeangaben sind Größenordnungen, Führungsdienstgrade typische Besetzungen. Stand Oktober 2026.</p>
  <h2 id="app">Als App installieren</h2>
  ${standalone()?'<p>AGAdemy läuft gerade als App. Nach dem ersten Öffnen funktioniert sie auch ohne Internet.</p>':`<p>AGAdemy lässt sich wie eine App auf den Startbildschirm legen. Sie öffnet sich dann ohne Browserleiste und funktioniert nach dem ersten Öffnen auch ohne Internet.</p>
  ${installEvt?'<button class="btn" id="install" style="flex:none;padding:10px 14px;font-size:16px;margin-bottom:10px">Jetzt installieren</button>':''}
  <p><strong>iPhone und iPad:</strong> In Safari unten (bzw. oben) auf das Teilen-Symbol tippen, dann „Zum Home-Bildschirm“ und „Hinzufügen“.</p>
  <p><strong>Android:</strong> In Chrome oben rechts auf das Menü ⋮ tippen, dann „App installieren“ oder „Zum Startbildschirm hinzufügen“.</p>
  <p><strong>Rechner:</strong> In Chrome oder Edge auf das Installieren-Symbol rechts in der Adressleiste klicken. In Safari auf dem Mac: Menü „Ablage“, dann „Zum Dock hinzufügen“.</p>`}
  <h2>Lernstand</h2>
  <p>Der Lernstand wird nur auf diesem Gerät gespeichert. Auf einem anderen Gerät beginnen Sie neu, und das Löschen der Browserdaten setzt ihn zurück. Auf iPhone und iPad hat die installierte App einen eigenen Lernstand, getrennt von Safari.</p>
  <button class="btn ghost" id="reset" style="flex:none;padding:10px 14px;font-size:16px">Lernstand zurücksetzen</button>
  <h2>Lizenz</h2>
  <p>Code unter MIT, Inhalte unter CC BY 4.0. Quelltext auf <a href="https://github.com/FlorianWilhelm/agademy">GitHub</a>.</p>
  ${CHANGES.length?`<h2 id="neu">Was ist neu</h2>${CHANGES.map(c=>`<h3 class="lg">Version ${esc(c.v)} <span class="small">${esc(c.d)}</span></h3>
  <ul class="changes">${c.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`).join('')}
  <p class="small">Alle Änderungen im <a href="https://github.com/FlorianWilhelm/agademy/blob/main/CHANGELOG.md">Changelog</a>.</p>`:''}
  </div>`;
}
function render(){
  renderDecks();
  document.getElementById('instBtn').hidden=standalone()||(mode==='help'&&!installEvt);
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-current',b.dataset.mode===mode?'page':'false'));
  const v=document.getElementById('view');
  v.innerHTML=mode==='basics'?renderBasics():mode==='learn'?renderLearn():mode==='quiz'?renderQuiz():mode==='ref'?renderRef():renderHelp();
  if(mode==='ref'&&refTab==='beh') filterGloss();
  if(mode==='ref'&&refTab==='abz') setHl(hl);
  spy();
  const sub=lesson&&mode==='basics'?LESSONS.find(l=>l.id===lesson).t:mode==='ref'?v.querySelector('[aria-pressed="true"]').textContent:{basics:'Grundlagen',learn:'Lernkarten',quiz:'Quiz',help:'Hilfe'}[mode];
  document.title=sub+' · AGAdemy';
}
function filterGloss(){
  const q=glossQ.trim().toLowerCase();let any=false;
  document.querySelectorAll('.gloss').forEach(sec=>{let n=0;const all=!q||sec.querySelector('h3').textContent.toLowerCase().includes(q); // Treffer im Titel zeigt den ganzen Abschnitt
    sec.querySelectorAll('dl div').forEach(d=>{const m=all||d.textContent.toLowerCase().includes(q);d.hidden=!m;if(m)n++});
    sec.hidden=!n;if(n)any=true;
    const c=document.querySelector('.jump [data-jump="'+sec.id+'"]');if(c) c.hidden=!n});
  spy();
  const e=document.getElementById('gnone');if(e) e.hidden=any;
}
let jumpTo=null; // zuletzt angesprungener Abschnitt
function spy(){ // markiert in der Sprungleiste den Abschnitt, der gerade oben steht
  const bar=document.querySelector('.jump');if(!bar) return;
  const cs=[...bar.querySelectorAll('.chip:not([hidden])')];let cur=cs[0];
  const top=c=>{const el=document.getElementById(c.dataset.jump);return el?el.getBoundingClientRect().top:Infinity};
  for(const c of cs) if(top(c)<=bar.offsetHeight+24) cur=c;
  if(innerHeight+scrollY>=document.documentElement.scrollHeight-2){ // ganz unten erreichen die letzten Abschnitte den oberen Rand nie
    const j=cs.find(c=>c.dataset.jump===jumpTo);cur=j&&top(j)<innerHeight?j:cs.filter(c=>top(c)<innerHeight).pop()||cur}
  cs.forEach(c=>c.setAttribute('aria-current',c===cur));
  if(cur){const l=cur.offsetLeft-bar.offsetLeft,r=l+cur.offsetWidth;
    if(l<bar.scrollLeft+16||r>bar.scrollLeft+bar.clientWidth-16) bar.scrollLeft=l-16}
}
addEventListener('scroll',spy,{passive:true});
document.addEventListener('input',e=>{if(e.target.id==='gq'){glossQ=e.target.value;filterGloss();history.replaceState(null,'',hashOf())}});

/* ---------- Links ---------- */
// Die URL bestimmt die Ansicht: #/bereich/unterseite/abschnitt?q=suche
const MODES={grundlagen:'basics',lernkarten:'learn',quiz:'quiz',nachschlagen:'ref',hilfe:'help'};
const REFS={dienstgrade:'dg',abzeichen:'abz',gliederung:'gl',staebe:'stab',begriffe:'beh'};
const TOPICS={dienstgrade:'dg',abzeichen:'abz',marine:'mar',gliederung:'gl',groessenzeichen:'sym',staebe:'stab',behoerden:'beh',staat:'staat',buendnis:'nato',abkuerzungen:'abk',geheimschutz:'vs',digitalisierung:'dig',anrede:'eti'};
const slug=(map,v)=>Object.keys(map).find(k=>map[k]===v);
const topicHash=(m,d)=>'#/'+slug(MODES,m)+(d==='all'?'':'/'+slug(TOPICS,d));
function hashOf(m=mode,sec){
  let h='#/'+slug(MODES,m);
  if(m==='basics'&&lesson) h+='/'+lesson;
  if(m==='learn'||m==='quiz') return topicHash(m,deck);
  if(m==='help'&&sec) h+='/'+sec;
  if(m==='ref'){h+='/'+slug(REFS,refTab)+(sec?'/'+sec:'');if(refTab==='beh'&&glossQ.trim()) h+='?q='+encodeURIComponent(glossQ.trim())}
  return h;
}
let helpFrom='#/grundlagen'; // Ansicht vor der Hilfe, dorthin führen „Zurück“ und erneutes Antippen des Hilfe-Knopfs
function go(h){if(location.hash===h) route();else location.hash=h}
function route(){
  const [path,qs]=location.hash.replace(/^#\/?/,'').split('?');
  let [m,a,b]=path.split('/').map(x=>{try{return decodeURIComponent(x)}catch(e){return x}});
  const nm=MODES[m]||'basics';
  if(nm==='quiz'&&mode!=='quiz'&&quiz&&quiz.i>=quiz.qs.length) quiz=null;
  if(nm==='help'&&mode!=='help') helpFrom=hashOf();
  mode=nm;
  lesson=mode==='basics'&&LESSONS.some(l=>l.id===a)?a:null;
  if(mode==='learn'||mode==='quiz'){const d=TOPICS[a]||'all';if(d!==deck){deck=d;cur=null;quiz=null}}
  if(mode==='ref'){refTab=REFS[a]||'dg';glossQ=new URLSearchParams(qs||'').get('q')||''}
  if(mode==='ref'&&refTab==='abz'&&b==='luftwaffe'){hl='lw';b='heer'} // früherer eigener Abschnitt
  render();
  const sec=mode==='ref'?b:mode==='help'?a:null;
  const el=sec?document.querySelector('#view [id="'+CSS.escape(sec)+'"]'):null;
  const h=hashOf(mode,el&&sec);
  if(location.hash!==h) history.replaceState(null,'',h); // ungültige oder unvollständige Links korrigieren
  el?el.scrollIntoView():window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t) return;
  if(t.dataset.back||t.dataset.mode==='help'&&mode==='help'){go(helpFrom);return}
  if(t.dataset.mode){const m=t.dataset.mode;if(m==='basics')lesson=null;if(m==='quiz'&&mode==='quiz'&&quiz&&quiz.i>=quiz.qs.length)quiz=null;go(hashOf(m));return}
  if(t.dataset.lesson!==undefined){go('#/grundlagen'+(t.dataset.lesson?'/'+t.dataset.lesson:''));return}
  if(t.dataset.practice){go(topicHash(t.dataset.pm||'learn',t.dataset.practice));return}
  if(t.id==='topicBtn'){openSheet();return}
  if(t.dataset.close){closeSheet();return}
  if(t.dataset.deck){closeSheet();if(t.dataset.deck===deck){cur=null;quiz=null}go(topicHash(mode,t.dataset.deck));return}
  if(t.dataset.jump){jumpTo=t.dataset.jump;const el=document.getElementById(t.dataset.jump);if(el){el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});history.replaceState(null,'',hashOf(mode,t.dataset.jump))}return}
  if(t.dataset.hl){setHl(t.dataset.hl);return}
  if(t.dataset.ref){go('#/nachschlagen/'+slug(REFS,t.dataset.ref));return}
  if(t.dataset.opt!==undefined){const q=quiz.qs[quiz.i];q.chosen=+t.dataset.opt;const ok=q.opts[q.chosen]===q.c.a;
    if(ok){quiz.score++;setBox(q.c,boxOf(q.c)+1)}else setBox(q.c,0);render();return}
  const a=t.dataset.act;
  if(a==='reveal'){revealed=true;render()}
  else if(a==='ok'||a==='again'){setBox(cur,a==='ok'?boxOf(cur)+1:0);last=cur;cur=null;render()}
  else if(a==='next'){quiz.i++;render()}
  else if(a==='newquiz'){quiz=null;render()}
  if(t.id==='install'||t.id==='instBtn'){install();return}
  if(t.id==='reset'&&confirm('Lernstand für alle Karten zurücksetzen?')){store={box:{},read:{}};save();cur=null;quiz=null;render()}
});
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet') closeSheet()});
document.addEventListener('keydown',e=>{
  if(mode!=='learn'||document.getElementById('sheet').open||e.target.closest('input,textarea')) return;
  if(e.code==='Space'&&!revealed){e.preventDefault();revealed=true;render()}
  else if(revealed&&(e.key==='1'||e.key==='2')){setBox(cur,e.key==='2'?boxOf(cur)+1:0);last=cur;cur=null;render()}
});
route();
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

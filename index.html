:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#0f1c33; --muted:#51627a; --line:#c4cfdb;
  --accent:#2fd6d0; --accent-ink:#0a6f6b; --warn:#f2c21b; --bad:#c2410c; --frame:#0f1c33;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a2e; --surface:#152640; --ink:#e7edf4; --muted:#9aabc2; --line:#2b4266;
    --accent-ink:#2fd6d0; --frame:#cfe0f0; --bad:#fb8a5a;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a2e; --surface:#152640; --ink:#e7edf4; --muted:#9aabc2; --line:#2b4266;
  --accent-ink:#2fd6d0; --frame:#cfe0f0; --bad:#fb8a5a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent-ink)}
.app{max-width:640px;margin:0 auto;padding:0 16px 96px;min-height:100%}
header.top{display:flex;align-items:center;gap:14px;padding:22px 0 14px}
header.top svg{flex:none}
h1{font:700 clamp(24px,6.5vw,30px)/1.05 var(--head);margin:0;letter-spacing:.01em}
header.top p{margin:4px 0 0;color:var(--muted);font-size:15px}
h1 .ver{font:400 13px var(--body);color:var(--muted);letter-spacing:0;margin-left:4px;white-space:nowrap}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;margin:4px 0 18px}
.topic[hidden]{display:none}
.topic .t{flex:1;min-width:0}
.topic .k{display:block;font-size:13px;color:var(--muted)}
.topic .n{display:block;font:600 21px/1.15 var(--head)}
.topic .chev{flex:none;width:22px;height:22px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:85vh;border-radius:14px 14px 0 0;margin:auto auto 0;box-shadow:0 -8px 40px rgba(0,0,0,.35)}
@media (min-width:700px){dialog{border-radius:12px;margin:auto}}
dialog::backdrop{background:rgba(8,16,30,.55)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sheet-head h2{margin:0}
.sheet-head button{border:0;background:none;font-size:15px;color:var(--accent-ink);font-weight:600;padding:6px}
.tlist{list-style:none;margin:0;padding:0 8px 18px}
.tlist button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:11px 12px}
.tlist button[aria-current="true"]{background:var(--bg);box-shadow:inset 4px 0 0 var(--accent)}
.tlist .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.tlist .nm{font:600 19px/1.2 var(--head)}
.tlist .ct{font-size:13px;color:var(--muted);white-space:nowrap}
.fig{display:flex;justify-content:center;margin-top:16px}
.help h2{margin-top:24px}
.help .back+h2{margin-top:10px}
.help h3:not(.lg){font:600 20px/1.2 var(--head);margin:16px 0 4px}
.help .callout{margin:14px 0}
.help p{margin:0 0 10px}
.changes{margin:0 0 10px;padding-left:20px;font-size:15px;color:var(--muted)}
.changes li{margin:2px 0}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Karte als taktisches Zeichen: Rahmen plus Größenzeichen darüber */
.card{background:var(--surface);border:2px solid var(--line);border-radius:10px;min-height:240px;padding:26px 22px;display:flex;flex-direction:column;justify-content:center}
.card .deckname{font-size:14px;color:var(--muted);margin:0 0 10px}
.q{font:600 27px/1.15 var(--head);margin:0}
.ans{margin-top:20px;padding-top:18px;border-top:1.5px dashed var(--line)}
.ans .a{font:700 25px/1.15 var(--head);color:var(--accent-ink);margin:0}
.note{color:var(--muted);font-size:15px;margin:8px 0 0}
.ans svg{display:block;margin-top:8px;color:var(--frame)}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:6px;padding:14px 12px;font:600 19px/1 var(--head);letter-spacing:.02em}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ok{background:var(--accent);color:#06302e}
.btn.again{background:var(--warn);color:#2b2200}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.boxes{display:flex;gap:4px;margin-top:22px}
.boxes div{flex:1;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.boxes b{display:block;font:600 18px/1.1 var(--head);color:var(--ink)}
.boxes span{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:4px}
.boxes span.f{background:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;font-size:17px;display:flex;align-items:center;gap:12px}
.opt.right{border-color:var(--accent);box-shadow:inset 6px 0 0 var(--accent)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 6px 0 0 var(--bad)}
.opt:disabled{cursor:default}
.opts.img{grid-template-columns:repeat(4,1fr)}
.opts.img .opt{justify-content:center;padding:10px 4px}
.insgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 8px;margin-bottom:22px}
.insgrid figure{margin:0;text-align:center;font-size:13px;line-height:1.25;min-width:0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.insgrid svg{display:block;margin:0 auto 4px}
h3.lg{font:600 18px/1.2 var(--head);margin:18px 0 8px;padding-bottom:4px;border-bottom:1.5px solid var(--line)}
h4.dgg{font:600 14px/1.2 var(--head);color:var(--accent-ink);margin:0 0 8px}
.insgrid+h4.dgg{margin-top:-8px}
h2{font:600 22px/1.2 var(--head);margin:6px 0 10px}
.score{font:700 64px/1 var(--head);margin:0}
.seg{display:flex;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.seg button{flex:1;border:0;background:var(--surface);padding:9px 4px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.sm{display:inline-flex;margin:0 0 12px}
.seg.sm button{flex:none;padding:6px 16px;font-size:14px}
.scroll{overflow-x:auto;border:1.5px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 16px/1.2 var(--head);background:var(--bg)}
tr.grp td{font:600 15px/1.2 var(--head);color:var(--accent-ink);background:var(--bg);padding-top:12px}
td.sym{color:var(--frame);width:64px}
.small{font-size:13px;color:var(--muted)}
.search{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:4px}
.gloss[hidden],dl div[hidden]{display:none}
dl{margin:0}
dl div{padding:10px 0;border-bottom:1px solid var(--line)}
dt{font:600 19px/1.2 var(--head)}
dd{margin:2px 0 0;color:var(--muted)}
.helpbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.helpbtn[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.helpbtn.inst{background:var(--accent);border-color:var(--accent);color:#06302e}
.helpbtn[hidden]{display:none}
.tbtns{flex:none;display:flex;gap:8px}
.lessons{list-style:none;margin:0;padding:0;counter-reset:l}
.lessons li+li{margin-top:8px}
.lessons button{width:100%;text-align:left;display:flex;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.lessons .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 17px/1 var(--head);background:var(--bg);color:var(--muted)}
.lessons .num.done{background:var(--accent);color:#06302e}
.lessons .lt{display:block;font:600 20px/1.2 var(--head)}
.lessons .ld{display:block;font-size:14px;color:var(--muted)}
.intro{color:var(--muted);margin:0 0 16px}
.lesson h2{font:700 30px/1.1 var(--head);margin:6px 0 14px}
.lesson h3{font:600 20px/1.2 var(--head);margin:22px 0 4px}
.lesson p{margin:0 0 12px}
.help p,.lesson p,.callout{hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:10 4 4;text-wrap:pretty}
h1,h2,h3{text-wrap:balance}
.back{border:0;background:none;color:var(--accent-ink);font-weight:600;padding:4px 0;font-size:15px}
.callout{background:var(--surface);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 14px;margin:16px 0;font-size:16px}
.ladder{list-style:none;margin:8px 0 14px;padding:0;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.ladder li{display:flex;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:15px}
.ladder li:last-child{border-bottom:0}
.ladder strong{flex:0 0 38%;font:600 17px/1.25 var(--head)}
.ladder span{color:var(--muted)}
.ladder strong:has(.tsym){display:flex;align-items:center;gap:10px}
.tsym{flex:0 0 auto}
.figs{display:flex;flex-wrap:wrap;gap:12px 10px;margin:10px 0 6px}
.figs figure{margin:0;width:62px;text-align:center;font-size:12px;line-height:1.2;color:var(--muted);hyphens:manual;-webkit-hyphens:manual}
.figs svg{display:block;margin:0 auto 4px}
.lesson .actions{margin-top:22px;flex-direction:column}
.pager,.duo{display:flex;gap:10px}
.duo .btn{line-height:1.2}
.pager .btn{line-height:1.2;padding:10px 12px;font-size:17px;max-width:calc(50% - 5px)} /* allein so breit wie neben dem anderen */
.pager small{display:block;font:600 13px/1.2 var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.pager .prev{text-align:left}.pager .prev small::before{content:"← "}
.pager .next{text-align:right;margin-left:auto}.pager .next small::after{content:" →"}
@media (max-width:559px){.pager{flex-direction:column}.pager .btn{margin-left:0;align-self:stretch;max-width:none}} /* lange Lektionstitel brauchen die volle Breite */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar div{display:flex;max-width:640px;width:100%}
nav.tabbar button{flex:1;border:0;background:none;padding:14px 2px;font:600 17px/1 var(--head);color:var(--muted)}
nav.tabbar button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
@media (prefers-reduced-motion: no-preference){
  .ans{animation:show .18s ease-out}
  @keyframes show{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
#view [id]{scroll-margin-top:64px}
/* Sprungleiste in Nachschlagen: bleibt beim Scrollen oben, markiert den aktuellen Abschnitt */
.jump{position:sticky;top:0;z-index:2;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;background:var(--bg);margin:0 -16px 8px;padding:8px 16px;border-bottom:1.5px solid var(--line)}
.jump .chip{color:var(--ink)}
.jump .chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jump .chip[hidden]{display:none}
</style>

{v:"0.7",d:"2026-10-03",items:[

        s+=`<rect x="29.2" y="14" width="1.6" height="23" rx=".8" fill="${ink}"/><circle cx="30" cy="13.6" r="1.4" fill="${ink}"/>`;
        s+=`<path d="M30 36 C25 34.5 25 31.5 30 30.5 C35 29.5 35 26.5 30 25.5 C25 24.5 25 21.5 30 20.5 C33.5 19.8 34.5 18.2 33 17" fill="none" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/>`;
        s+=`<ellipse cx="32.4" cy="16.4" rx="1.6" ry="1.1" transform="rotate(-35 32.4 16.4)" fill="${ink}"/>`}
      else if(e==='bar') s+=`<rect x="6.5" y="86" width="47" height="4" fill="${ink}"/>`;
      else if(e==='w'){ // Eichenlaub: zwei sichelförmige Wedel aus schmalen, gelappten Blättern, unten spitz zusammenlaufend
        const leaf='M0 0 C-.8 -.6 -1.4 -1.6 -1.1 -2.6 C-1.8 -3 -1.8 -4 -1.2 -4.4 C-1.7 -5 -1.4 -6 -.8 -6.2 C-.8 -7.2 -.3 -7.8 0 -8 C.3 -7.8 .8 -7.2 .8 -6.2 C1.4 -6 1.7 -5 1.2 -4.4 C1.8 -4 1.8 -3 1.1 -2.6 C1.4 -1.6 .8 -.6 0 0 Z';
        const f=v=>v.toFixed(2),P=[[.8,88],[9,85.5],[20.5,79.5],[15.5,64.5]]; // Bézier-Stützpunkte des Zweigs (x nach außen)
        const bz=(u,k)=>{const v=1-u;return v*v*v*P[0][k]+3*v*v*u*P[1][k]+3*v*u*u*P[2][k]+u*u*u*P[3][k]};
        const db=(u,k)=>{const v=1-u;return 3*v*v*(P[1][k]-P[0][k])+6*v*u*(P[2][k]-P[1][k])+3*u*u*(P[3][k]-P[2][k])};
        let g='';
        for(const side of [-1,1]){
          const X=x=>30+side*x,put=(u,ang,sc)=>{const rot=Math.atan2(side*db(u,0),-db(u,1))*180/Math.PI+side*ang;
            g+=`<path d="${leaf}" transform="translate(${f(X(bz(u,0)))} ${f(bz(u,1))}) rotate(${f(rot)}) scale(${f(sc)})" fill="${ink}" stroke="${board}" stroke-width=".35"/>`};
          g+=`<path d="M${f(X(P[0][0]))} ${P[0][1]} C${f(X(P[1][0]))} ${P[1][1]} ${f(X(P[2][0]))} ${P[2][1]} ${f(X(P[3][0]))} ${P[3][1]}" fill="none" stroke="${ink}" stroke-width="1.2" stroke-linecap="round"/>`;
          for(let i=0;i<9;i++){const u=.05+i*.105,w=Math.sin(Math.PI*(.25+u*.7)); // Wedel in der Mitte am breitesten
            put(u,-40,.6+.75*w); // außen
            put(Math.min(u+.04,1),32,.5+.5*w); // innen
          }
          put(1,0,.95); // Spitze
        }
        s+=wing?`<g transform="translate(0 -4.5) translate(30 88) scale(.92) translate(-30 -88)">${g}</g>`:g; // Luftwaffe: über der Schwinge
      }
    });
    const pip=(x,y)=>{const R=5.9,P=(a,r)=>(x+r*Math.cos(a)).toFixed(2)+','+(y+r*Math.sin(a)).toFixed(2),d=a=>R/(Math.abs(Math.cos(a))+Math.abs(Math.sin(a)));
      let p=[],hi='';for(let i=0;i<40;i++){const a=i*Math.PI/20-Math.PI/2;p.push(P(a,i%2?d(a)*.78:d(a)*(i%10===0?1:1.06)))}
      for(let k=0;k<4;k++){const a=k*Math.PI/2-Math.PI/2;hi+=`<polygon points="${x},${y} ${P(a,R*.97)} ${P(a+Math.PI/4,R*.3)}" fill="#fff" fill-opacity=".25"/>`}
      return `<polygon points="${p.join(' ')}" fill="${ink}"/>`+hi}; // Raute mit gezackten Kanten und Graten zu den vier Spitzen
    const pm=spec.find(x=>/^p\d/.test(x));
    if(pm){const hasW=spec.includes('w');const base=hasW?(wing?72.5:76):(wing?73.5:74);
      if(pm==='p4s'){s+=pip(30,base-25)+pip(30,base-12.5)+pip(23.5,base)+pip(36.5,base)}
      else{const n=+pm[1];for(let i=0;i<n;i++) s+=pip(30,base-i*12.5)}}
    if(wing){ // Schwinge: breites, flaches Federband mit spitzen Enden, oben in der Mitte gekerbt, unten spitz
      const f=v=>v.toFixed(2);
      for(const side of [-1,1]){
        const X=x=>f(30+side*x);let low='';
        for(let i=1;i<=6;i++){const a=i/6,b=(i-.5)/6; // Federspitzen an der Unterkante
          low+=` L${X(22.8-b*19.3)} ${f(87.2+b*3.8+.8)} L${X(22.8-a*19.3)} ${f(87.2+a*3.8)}`}
        s+=`<path d="M${X(0)} 86.8 L${X(1.6)} 85.4 L${X(22.2)} 84.9 Q${X(23.8)} 85.4 ${X(22.8)} 87.2${low} L${X(0)} 92.8 Z" fill="${ink}"/>`;
        s+=`<path d="M${X(2.5)} 87 L${X(20.5)} 86.4 M${X(3)} 88.6 L${X(16)} 88" fill="none" stroke="${board}" stroke-width=".45" stroke-linecap="round"/>`;
      }
    }
  }
  return `<svg width="${W}" height="${W*100/60}" viewBox="0 0 60 100" role="img" aria-label="Dienstgradabzeichen">${s}</svg>`;
}

/* ---------- Symbole ---------- */
function marker(m){
  const parts=[];let w=0;const sp=4;
  const push=(svg,width)=>{parts.push([svg,width]);w+=width+sp};
  if(m==='Ø') push(x=>`<circle cx="${x+6}" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="${x+1}" y1="13" x2="${x+11}" y2="1" stroke="currentColor" stroke-width="2"/>`,12);
  else if(/^●+$/.test(m)) [...m].forEach(()=>push(x=>`<circle cx="${x+5}" cy="7" r="4.5" fill="currentColor"/>`,10));
  else if(/^I+$/.test(m)) [...m].forEach(()=>push(x=>`<line x1="${x+1.5}" y1="1" x2="${x+1.5}" y2="13" stroke="currentColor" stroke-width="2.6"/>`,3));
  else if(/^X+$/.test(m)) [...m].forEach(()=>push(x=>`<path d="M${x+1} 1 L${x+11} 13 M${x+11} 1 L${x+1} 13" stroke="currentColor" stroke-width="2.4"/>`,12));
  w-=sp;let x=0,inner='';parts.forEach(([f,pw])=>{inner+=f(x);x+=pw+sp});
  return {inner,w};
}
function sizeMark(m,h=22){const {inner,w}=marker(m);return `<svg width="${w*h/14}" height="${h}" viewBox="0 0 ${w} 14" aria-hidden="true">${inner}</svg>`}
function unitSym(m,W=60){
  const {inner,w}=marker(m);const k=Math.min(1,(W-4)/w),off=(W-w*k)/2; // breite Zeichen (z. B. XXXX) passend verkleinern
  return `<svg width="${W}" height="${W*0.9}" viewBox="0 0 ${W} ${W*0.9}" role="img" aria-label="Größenzeichen ${m}">
   <g transform="translate(${off} ${(1-k)*14}) scale(${k})">${inner}</g>
   <rect x="2" y="18" width="${W-4}" height="${W*0.9-20}" fill="none" stroke="currentColor" stroke-width="2.5"/>
   <path d="M2 18 L${W-2} ${W*0.9-2} M${W-2} 18 L2 ${W*0.9-2}" stroke="currentColor" stroke-width="1.6"/></svg>`;
}

/* ---------- Grundlagen (Lektionen) ---------- */
const figs=(items,W=46)=>`<div class="figs">${items.map(([k,c])=>`<figure>${insignia(k,W)}<figcaption>${esc(c)}</figcaption></figure>`).join('')}</div>`;
const syms=items=>`<div class="figs">${items.map(([m,c])=>`<figure style="color:var(--frame)">${unitSym(m,52)}<figcaption>${esc(c)}</figcaption></figure>`).join('')}</div>`;
function tskSym(t){ // Symbole der Teilstreitkräfte, wie an der Schirmmütze: eigene schematische Zeichnungen
  let s='';
  if(t==='heer'){ // gekreuzte Schwerter, Spitzen oben
    const sw=`<path d="M20 3 L21.7 6.5 V27.6 H18.3 V6.5 Z"/><rect x="14.6" y="27.6" width="10.8" height="2.6" rx="1.1"/><rect x="19" y="30" width="2" height="4.4"/><circle cx="20" cy="36" r="2"/>`;
    s=`<g transform="rotate(38 20 20)">${sw}</g><g transform="rotate(-38 20 20)">${sw}</g>`;
  } else if(t==='lw'){ // Schwinge: Federband mit spitzen Enden, unten gezackt
    const f=v=>v.toFixed(2);
    for(const side of [-1,1]){
      const X=x=>f(20+side*x);let low='';
      for(let i=1;i<=6;i++){const a=i/6,b=(i-.5)/6;low+=` L${X(18-b*15.5)} ${f(19+b*4.5+1.2)} L${X(18-a*15.5)} ${f(19+a*4.5)}`}
      s+=`<path d="M${X(0)} 18.2 L${X(2)} 16.6 L${X(17.4)} 15.6 Q${X(19.6)} 16.2 ${X(18)} 19${low} L${X(0)} 25.6 Z"/>`;
      s+=`<path d="M${X(3)} 18.3 L${X(16)} 17.6 M${X(3.5)} 20.6 L${X(12.5)} 20.1" fill="none" stroke="var(--surface)" stroke-width=".7" stroke-linecap="round"/>`;
    }
  } else if(t==='mar'){ // unklarer Anker: Ring, Stock, Schaft, Arme mit Flunken, Tau
    s=`<circle cx="20" cy="5.4" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="12.5" y="10" width="15" height="2.6" rx="1.2"/><rect x="18.8" y="8" width="2.4" height="26"/>
     <path d="M8.6 25.2 Q20 38.5 31.4 25.2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M5.6 22 L11.6 24.2 L8 28.2 Z M34.4 22 L28.4 24.2 L32 28.2 Z"/>
     <path d="M22.4 6.8 C28.5 8.5 28 13.5 20 15.5 C12 17.5 12 22.5 20 24.5 C25.5 25.8 26 28.5 22.8 30.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`;
  }
  return `<svg class="tsym" viewBox="0 0 40 40" width="34" height="34" fill="currentColor" aria-hidden="true">${s}</svg>`;
}
